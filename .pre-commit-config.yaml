# Pre-commit hooks for protobuf
repos:
- repo: local
  hooks:

      # Diamond-dep detector — fail loud when build.zig.zon transitively
      # pins the same package name to two different content hashes.
      # Soft-fails when the zig package cache hasn't been populated yet
      # (run `zig build --fetch` first).
      # See: gitlab.com/devnw/codepros/geode/geode/scripts/detect_diamond_deps.py
  - id: detect-diamond-deps
    name: detect diamond deps in build.zig.zon
    entry: bash
    args:
    - -c
    - |
      python3 scripts/detect_diamond_deps.py
      rc=$?
      if [ $rc -eq 2 ]; then
        echo "detect-diamond-deps: cache not populated; skipping (run 'zig build --fetch')"
        exit 0
      fi
      exit $rc
    language: system
    files: ^build\.zig\.zon$
    pass_filenames: false
