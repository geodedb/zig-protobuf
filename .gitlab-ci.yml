include:
  - component: gitlab.com/devnw/ci-catalog/zig-version-tag-check@v1.57.1
    inputs:
      tags: ["company", "linux", "x86"]

default:
  # The checksum-pinned Zig archive is x86_64; exclude ARM Linux runners.
  interruptible: true
  tags:
    - company
    - linux
    - x86
  image: debian:bookworm-slim
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends curl ca-certificates xz-utils
    - curl -fsSLO "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
    - echo "${ZIG_SHA256}  zig-x86_64-linux-${ZIG_VERSION}.tar.xz" | sha256sum -c -
    - tar -xJf "zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
    - export PATH="$CI_PROJECT_DIR/zig-x86_64-linux-${ZIG_VERSION}:$PATH"
    - zig version

variables:
  ZIG_VERSION: "0.16.0"
  # SHA-256 of zig-x86_64-linux-${ZIG_VERSION}.tar.xz, from
  # ziglang.org/download/index.json. Update when bumping ZIG_VERSION.
  ZIG_SHA256: "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"

stages:
  - check
  - test

fmt:
  stage: check
  script:
    - >
      zig fmt --check
      build.zig
      src/
      utils/
      bench/
      bootstrapped-generator/
      tests/tests.zig
      tests/tests_varints.zig
      tests/tests_fixedsizes.zig
      tests/tests_complex_type.zig
      tests/tests_json.zig
      tests/oneof.zig
      tests/optionals.zig
      tests/alltypes.zig
      tests/leaks.zig
      tests/graphics.zig
      tests/mapbox.zig
      tests/integration.zig

build:
  stage: test
  script:
    - zig build -Doptimize=Debug

test:
  stage: test
  script:
    - zig build test --summary all

# SONNY-4778: external hook tools must preserve the enclosing worktree.
hook-env-regression:
  stage: check
  image: python:3.15-slim-bookworm
  tags: [company, linux, x86]
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends git
  script:
    - python3 scripts/test_hook_env.py

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_COMMIT_TAG'
      auto_cancel:
        on_new_commit: none
    # SRE-194: validation pipelines fail fast on the first blocking job failure;
    # these rules admit only what the next rule already admits.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      auto_cancel:
        on_job_failure: all
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      auto_cancel:
        on_job_failure: all
    - when: always
